<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Banner de la página de empresa de LinkedIn · Aicia</title>
<!-- Portada de la página de empresa de Aicia en LinkedIn, 1128×191 (se dibuja al cuádruple y se achica a 2256×382 y 1128×191).
     Mismo sistema que el banner del perfil de Guille (banner.html). Muestra los dos servicios: la web de reservas (atrás) y el asistente (el chat, adelante). El logo de la empresa se superpone abajo a la izquierda
     (queda libre x 0–226 en la mitad de abajo) y en el celular se recortan los costados, así que todo va hacia el centro.
     ?prueba = muestra el logo simulado, la zona libre y el margen de los costados. -->
<style>
@font-face{font-family:"Geist";src:url(../aicia-web/fonts/geist-latin-wght-normal.woff2) format("woff2");font-weight:100 900;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:"Geist";src:url(../aicia-web/fonts/geist-latin-ext-wght-normal.woff2) format("woff2");font-weight:100 900;unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Geist Mono";src:url(../aicia-web/fonts/geist-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Instrument Serif";src:url(../aicia-web/fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-style:italic;font-weight:400}
:root{--night:#06061A; --t1:#F4F4FA;
  /* Solo 3 tamaños de texto, como en el banner del perfil */
  --fs-title:30px; --fs-body:16px; --fs-small:13px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night)}
body{width:1128px;height:191px;overflow:hidden;font-family:"Geist",system-ui,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased}
.b{position:relative;width:1128px;height:191px;overflow:hidden;isolation:isolate;background:#06061A}
.b > *{position:absolute}
/* Fondo: azul noche, brillo violeta suave detrás del texto y del chat, grilla que se desvanece y viñeta.
   Los degradés se arman en JS con caída suave (sin anillos ni franjas). Sin grano: LinkedIn la recomprime. */
.bg,.glow,.grid,.vig{inset:0}
.grid{background-image:linear-gradient(rgba(199,201,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(199,201,255,.06) 1px,transparent 1px);background-size:48px 48px;background-position:center center}

/* Texto: centrado hacia la derecha, fuera de la zona del logo */
.tx{left:232px;top:46px;width:440px}
h1{font-weight:600;font-size:var(--fs-title);line-height:1.04;letter-spacing:-0.04em;color:#fff}
.serif{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;font-size:1.1em;letter-spacing:-0.01em;padding-right:.06em;
  background:linear-gradient(100deg,#B9BBFF 0%,#ECEDFF 52%,#C3C5FF 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.sub{margin-top:11px;font-size:var(--fs-body);font-weight:450;line-height:1.3;letter-spacing:-0.01em;color:rgba(232,233,255,.88);white-space:nowrap}
.sub .sep{margin:0 7px;color:rgba(199,201,255,.5)}

/* Chat chiquito a la derecha: el mismo vidrio del banner del perfil */
.win{left:757px;top:50px;width:250px;padding:9px;border-radius:17px;z-index:2;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035)),rgba(14,13,40,.55);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.22),0 22px 36px -18px rgba(3,2,20,.9)}
.win .bar{height:22px;display:flex;align-items:center;gap:4px;margin:0 -9px 8px;padding:0 11px;border-bottom:1px solid rgba(199,201,255,.10)}
.win .bar i{width:5px;height:5px;border-radius:50%;background:rgba(199,201,255,.28)}
.win .bar .live{margin-left:auto;width:6px;height:6px;background:#C7C9FF;box-shadow:0 0 0 3px rgba(199,201,255,.14),0 0 8px 1px rgba(199,201,255,.6)}
.m{position:relative;display:flow-root;max-width:230px;padding:6px 9px 6px;border-radius:11px;font-size:var(--fs-small);line-height:1.25;letter-spacing:0}
.m .t{float:right;display:inline-flex;align-items:center;gap:3px;margin:3px 0 -1px 7px;font:500 var(--fs-small)/1 "Geist Mono",monospace;letter-spacing:-0.05em;opacity:.5}
.m .t svg{width:12px;height:8px}
.m.in{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);color:var(--t1);border-bottom-left-radius:4px}
.m.out{margin:6px 0 0 auto;color:#fff;border-bottom-right-radius:4px;
  background:linear-gradient(150deg,#6E71F4,#4F46E5 55%,#4338CA);box-shadow:inset 0 1px 0 rgba(255,255,255,.30),0 8px 18px -8px rgba(79,70,229,.7)}
.m.out .t{opacity:.72}

/* Web de reservas chiquita, detrás del chat: los mismos horarios que ofrece el asistente (19:00 elegido, 20:30 libre) */
.web{left:590px;top:34px;width:190px;padding:0 10px 10px;border-radius:14px;z-index:1;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03)),rgba(14,13,40,.6);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.11),inset 0 1px 0 rgba(255,255,255,.2),0 18px 30px -16px rgba(3,2,20,.9)}
.web .bar{height:16px;display:flex;align-items:center;gap:3px;margin:0 -10px 8px;padding:0 9px;border-bottom:1px solid rgba(199,201,255,.10)}
.web .bar i{width:4px;height:4px;border-radius:50%;background:rgba(199,201,255,.28)}
.web .bar b{margin-left:8px;width:64px;height:7px;border-radius:4px;background:rgba(199,201,255,.12)}
.web h3{font-size:var(--fs-small);font-weight:600;line-height:1.2;letter-spacing:0;color:#fff}
.web .day{margin-top:2px;font-size:var(--fs-small);line-height:1.2;color:rgba(199,201,255,.6)}
.web .slots{display:flex;gap:5px;margin-top:7px}
.web .slots span{padding:4px 6px;border-radius:7px;font:500 var(--fs-small)/1 "Geist Mono",monospace;letter-spacing:-0.04em;box-shadow:inset 0 0 0 1px rgba(199,201,255,.22);color:rgba(232,233,255,.85)}
.web .slots .off{color:rgba(199,201,255,.3);box-shadow:inset 0 0 0 1px rgba(199,201,255,.08);text-decoration:line-through}
.web .slots .on{color:#fff;background:linear-gradient(150deg,#6E71F4,#4F46E5 55%,#4338CA);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px -6px rgba(79,70,229,.8)}

/* ?fondo = solo el fondo (sin texto ni chat), por si LinkedIn tapa o corta algo */
.fondo .tx,.fondo .win,.fondo .web{display:none}

/* Prueba: logo de la empresa simulado, zona libre y margen de los costados en el celular */
.guide{display:none;inset:0;z-index:9;pointer-events:none}
.prueba .guide{display:block}
.guide .no{position:absolute;left:0;top:95px;width:226px;height:96px;background:repeating-linear-gradient(135deg,rgba(255,80,110,.16) 0 7px,rgba(255,80,110,.05) 7px 14px);outline:1px dashed rgba(255,120,140,.75);outline-offset:-1px}
.guide .side{position:absolute;top:0;bottom:0;width:113px;background:repeating-linear-gradient(135deg,rgba(255,214,102,.14) 0 7px,rgba(255,214,102,.04) 7px 14px);outline:1px dashed rgba(255,214,102,.7);outline-offset:-1px}
.guide .crop{position:absolute;left:0;right:0;height:43px;background:repeating-linear-gradient(135deg,rgba(120,200,255,.16) 0 7px,rgba(120,200,255,.05) 7px 14px);outline:1px dashed rgba(120,200,255,.7);outline-offset:-1px}
.guide .logo{position:absolute;left:28px;top:112px;width:136px;height:136px;border-radius:6px;background:#2a2c3e;box-shadow:0 0 0 4px #fff}
.guide .lbl{position:absolute;font:500 9px/1 "Geist Mono",monospace;letter-spacing:-0.02em}
</style>
</head>
<body>
<div class="b" id="banner">
  <div class="bg" id="bg"></div><div class="glow" id="glow"></div><div class="grid" id="grid"></div><div class="vig" id="vig"></div>

  <div class="tx">
    <h1>Ninguna reserva perdida<br>por <span class="serif">tardar en responder.</span></h1>
    <p class="sub">Webs de reservas<span class="sep">·</span>Asistentes de IA</p>
  </div>

  <div class="web" aria-hidden="true">
    <div class="bar"><i></i><i></i><i></i><b></b></div>
    <h3>Reservá tu turno</h3>
    <p class="day">Mañana</p>
    <div class="slots"><span class="off">18:00</span><span class="on">19:00</span><span>20:30</span></div>
  </div>

  <div class="win" aria-hidden="true">
    <div class="m in">¿Tienen turno para mañana?<span class="t">23:40</span></div>
    <div class="m out">¡Sí! Te quedan 19:00 o 20:30<span class="t">23:40<svg viewBox="0 0 16 11" fill="none" stroke="#C7C9FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6-7"/><path d="M6.5 8.2 7.5 9l6-7"/></svg></span></div>
  </div>

  <div class="guide">
    <div class="crop" style="top:0"></div><div class="crop" style="bottom:0"></div><div class="side" style="left:0"></div><div class="side" style="right:0"></div><div class="no"></div><div class="logo"></div>
    <span class="lbl" style="left:6px;top:6px;color:rgba(255,214,102,.95)">CELULAR: POSIBLE RECORTE</span>
    <span class="lbl" style="left:172px;top:100px;color:rgba(255,150,165,.95)">LOGO</span>
    <span class="lbl" style="left:420px;top:6px;color:rgba(140,210,255,.95)">VISTA PREVIA DE LINKEDIN: CORTA ARRIBA Y ABAJO</span>
  </div>
</div>
<script>
if (location.search.includes('prueba')) document.body.classList.add('prueba');
if (location.search.includes('fondo')) document.body.classList.add('fondo');
// Degradés con caída suave (como en los videos y la portada de WhatsApp)
function curve(xs, ys) {
  const n = xs.length, h = [], d = [], m = new Array(n).fill(0);
  for (let k = 0; k < n - 1; k++) { h.push(xs[k + 1] - xs[k]); d.push((ys[k + 1] - ys[k]) / h[k]); }
  for (let k = 1; k < n - 1; k++) m[k] = d[k - 1] * d[k] <= 0 ? 0 : 3 * (h[k - 1] + h[k]) / ((2 * h[k] + h[k - 1]) / d[k - 1] + (h[k] + 2 * h[k - 1]) / d[k]);
  return x => {
    if (x <= xs[0]) return ys[0]; if (x >= xs[n - 1]) return ys[n - 1];
    let k = 0; while (x > xs[k + 1]) k++;
    const u = (x - xs[k]) / h[k], u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[k] + (u3 - 2 * u2 + u) * h[k] * m[k] + (-2 * u3 + 3 * u2) * ys[k + 1] + (u3 - u2) * h[k] * m[k + 1];
  };
}
function eased(keys, n = 32) {
  const xs = keys.map(k => k[0]), fs = [0, 1, 2, 3].map(c => curve(xs, keys.map(k => k[1][c])));
  return Array.from({ length: n + 1 }, (_, i) => {
    const x = xs[0] + (xs[xs.length - 1] - xs[0]) * i / n, [r, g, b, a] = fs.map(f => f(x));
    return `rgba(${r.toFixed(2)},${g.toFixed(2)},${b.toFixed(2)},${Math.min(1, Math.max(0, a)).toFixed(4)}) ${(x * 100).toFixed(2)}%`;
  }).join(',');
}
const $ = id => document.getElementById(id);
$('bg').style.background = `linear-gradient(180deg,${eased([[0, [5, 5, 26, 1]], [.32, [9, 9, 36, 1]], [.7, [7, 7, 29, 1]], [1, [5, 5, 26, 1]]])})`;
$('glow').style.background =
  `radial-gradient(560px 230px at 640px 86px,${eased([[0, [79, 70, 229, .32]], [.45, [67, 56, 202, .11]], [.75, [67, 56, 202, 0]]])}),` +
  `radial-gradient(240px 130px at 878px 92px,${eased([[0, [99, 102, 241, .24]], [.55, [99, 102, 241, .07]], [1, [99, 102, 241, 0]]])}),` +
  `radial-gradient(380px 200px at 1060px 10px,${eased([[0, [79, 70, 229, .12]], [.75, [79, 70, 229, 0]]])})`;
// Solo fondo: una luz pareja y centrada (sin las manchas que iban detrás del texto y del chat)
if (location.search.includes('fondo')) $('glow').style.background =
  `radial-gradient(760px 250px at 60% 50%,${eased([[0, [79, 70, 229, .34]], [.5, [67, 56, 202, .12]], [.8, [67, 56, 202, 0]]])}),` +
  `radial-gradient(420px 180px at 92% 0%,${eased([[0, [99, 102, 241, .14]], [.8, [99, 102, 241, 0]]])})`;
$('grid').style.webkitMaskImage = $('grid').style.maskImage = `radial-gradient(640px 200px at 58% 46%,${eased([[0, [0, 0, 0, 1]], [.5, [0, 0, 0, .4]], [.85, [0, 0, 0, 0]]])})`;
$('vig').style.background = `radial-gradient(900px 260px at 56% 44%,${eased([[.55, [3, 3, 14, 0]], [1, [3, 3, 14, .55]]])})`;
</script>
</body>
</html>
