<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:ID;src:url(fonts/InterDisplay-SemiBold.otf);font-weight:600}
@font-face{font-family:ID;src:url(fonts/InterDisplay-Medium.otf);font-weight:500}
@font-face{font-family:IS;src:url(fonts/instrument-serif-latin-400-italic.woff2);font-style:italic}
body{margin:0;background:transparent;display:flex;flex-direction:column;align-items:flex-start;gap:20px;padding:20px}
.c{display:inline-block;padding:36px 44px;white-space:nowrap;text-shadow:0 2px 26px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.35)}
.kick{font:500 30px/1 ID;letter-spacing:.2em;color:#DDBB82;text-transform:uppercase}
.sans{font:600 118px/1 ID;letter-spacing:-.025em;color:#F5EFE7}
.sans.m{font-size:86px}
.serif{font:italic 400 136px/1 IS;letter-spacing:-.005em;color:#E2C08A}
.serif.m{font-size:100px}
.serif.w{color:#F5EFE7;font-size:132px}
.kick.lc{text-transform:none;letter-spacing:.1em;font-size:32px}
.ln{width:120px;height:3px;background:#DDBB82;border-radius:2px;box-shadow:0 0 18px rgba(0,0,0,.4)}
</style></head><body>
<div class="c kick lc" data-id="t1-kick">@barbero_leaa</div>
<div class="c sans" data-id="t1-a">El detalle</div>
<div class="c serif" data-id="t1-b">lo es todo.</div>
<div class="c sans m" data-id="t2-a">Prolijo desde</div>
<div class="c serif m" data-id="t2-b">todos los ángulos.</div>
<div class="c kick" data-id="t3-kick">Tu próximo corte</div>
<div class="c" data-id="t3-ln"><div class="ln"></div></div>
<div class="c serif w" data-id="t3-handle">@barbero_leaa</div>
</body></html>
